[project]
name = "modal-workspace-mcp"
version = "0.1.0"
description = "Remote MCP bridge from GitHub Copilot and other agents to Modal Sandboxes and Functions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "xiaoqianran" }]
dependencies = [
  "modal>=1.4.1,<2",
  "fastapi==0.115.14",
  "fastmcp==2.10.6",
  "pydantic==2.11.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
