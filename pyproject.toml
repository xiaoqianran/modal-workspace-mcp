[project]
name = "modal-workspace-mcp"
version = "0.6.0"
description = "Realtime Modal Workspace, GitHub repo, and native filesystem-watch bridge for ChatGPT GPT Actions and MCP clients"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "xiaoqianran" }]
dependencies = [
  "modal>=1.5.0,<2",
  "fastapi==0.115.14",
  "fastmcp==2.10.6",
  "pydantic==2.11.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["modal_workspace_mcp"]
