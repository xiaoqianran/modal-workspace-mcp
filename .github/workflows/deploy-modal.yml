name: Deploy Modal MCP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install .

      - name: Configure gateway secret
        env:
          MODAL_WORKSPACE_MCP_TOKEN: ${{ secrets.MODAL_WORKSPACE_MCP_TOKEN }}
          MODAL_WORKSPACE_ALLOWED_SECRETS: ${{ vars.MODAL_WORKSPACE_ALLOWED_SECRETS }}
          MODAL_WORKSPACE_ALLOWED_VOLUMES: ${{ vars.MODAL_WORKSPACE_ALLOWED_VOLUMES }}
        run: |
          test -n "$MODAL_WORKSPACE_MCP_TOKEN"
          args=(
            "MODAL_WORKSPACE_MCP_TOKEN=$MODAL_WORKSPACE_MCP_TOKEN"
          )
          if [ -n "$MODAL_WORKSPACE_ALLOWED_SECRETS" ]; then
            args+=("MODAL_WORKSPACE_ALLOWED_SECRETS=$MODAL_WORKSPACE_ALLOWED_SECRETS")
          fi
          if [ -n "$MODAL_WORKSPACE_ALLOWED_VOLUMES" ]; then
            args+=("MODAL_WORKSPACE_ALLOWED_VOLUMES=$MODAL_WORKSPACE_ALLOWED_VOLUMES")
          fi
          modal secret create modal-workspace-mcp-auth --force "${args[@]}"

      - name: Deploy MCP gateway
        run: modal deploy modal_app.py
