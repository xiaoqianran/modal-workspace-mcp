name: Deploy Modal Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "modal_app.py"
      - "modal_workspace_mcp/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-modal.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required GitHub Actions secrets
        env:
          GATEWAY_TOKEN: ${{ secrets.MODAL_WORKSPACE_MCP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID" || (echo "Missing MODAL_TOKEN_ID" >&2; exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo "Missing MODAL_TOKEN_SECRET" >&2; exit 1)
          test -n "$GATEWAY_TOKEN" || (echo "Missing MODAL_WORKSPACE_MCP_TOKEN" >&2; exit 1)

      - name: Install project
        run: python -m pip install .

      - name: Verify Modal authentication
        run: modal token info

      - name: Create or update gateway secret
        env:
          GATEWAY_TOKEN: ${{ secrets.MODAL_WORKSPACE_MCP_TOKEN }}
          ALLOWED_SECRETS: ${{ vars.MODAL_WORKSPACE_ALLOWED_SECRETS }}
          ALLOWED_VOLUMES: ${{ vars.MODAL_WORKSPACE_ALLOWED_VOLUMES }}
          DEFAULT_IMAGE_NAME: ${{ vars.MODAL_WORKSPACE_DEFAULT_IMAGE_NAME }}
        run: |
          set -euo pipefail
          args=("MODAL_WORKSPACE_MCP_TOKEN=$GATEWAY_TOKEN")
          if [ -n "${ALLOWED_SECRETS:-}" ]; then
            args+=("MODAL_WORKSPACE_ALLOWED_SECRETS=$ALLOWED_SECRETS")
          fi
          if [ -n "${ALLOWED_VOLUMES:-}" ]; then
            args+=("MODAL_WORKSPACE_ALLOWED_VOLUMES=$ALLOWED_VOLUMES")
          fi
          if [ -n "${DEFAULT_IMAGE_NAME:-}" ]; then
            args+=("MODAL_WORKSPACE_DEFAULT_IMAGE_NAME=$DEFAULT_IMAGE_NAME")
          fi
          modal secret create modal-workspace-mcp-auth --force "${args[@]}"

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          modal deploy modal_app.py 2>&1 | tee /tmp/modal-deploy.log
          endpoint="$(grep -Eo 'https://[A-Za-z0-9.-]+\.modal\.run' /tmp/modal-deploy.log | head -n1)"
          test -n "$endpoint" || (echo "Could not discover deployed Modal endpoint" >&2; exit 1)
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed gateway
        env:
          ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
          GATEWAY_TOKEN: ${{ secrets.MODAL_WORKSPACE_MCP_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$ENDPOINT/healthz" -o /tmp/health.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GATEWAY_TOKEN" \
            "$ENDPOINT/api/apps" -o /tmp/apps.json
          python - <<'PY'
          import json

          with open('/tmp/health.json', encoding='utf-8') as f:
              health = json.load(f)
          if health.get('ok') is not True:
              raise SystemExit(f"healthz failed: {health!r}")
          if health.get('version') != '0.4.0':
              raise SystemExit(f"unexpected deployed version: {health!r}")
          if health.get('realtime_exec') is not True:
              raise SystemExit(f"realtime exec not advertised: {health!r}")

          with open('/tmp/apps.json', encoding='utf-8') as f:
              apps = json.load(f)
          if not isinstance(apps, list):
              raise SystemExit(f"/api/apps did not return a list: {type(apps).__name__}")
          print(f"Gateway smoke test passed; /api/apps returned {len(apps)} apps")
          PY

      - name: Realtime Sandbox E2E
        env:
          ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
          GATEWAY_TOKEN: ${{ secrets.MODAL_WORKSPACE_MCP_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          endpoint = os.environ['ENDPOINT'].rstrip('/')
          token = os.environ['GATEWAY_TOKEN']
          sandbox_id = None

          def call(method, path, body=None, timeout=180):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(
                  endpoint + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  payload = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'{method} {path} -> HTTP {exc.code}: {payload}') from exc

          try:
              created = call('POST', '/api/sandboxes', {
                  'timeout_seconds': 300,
                  'idle_timeout_seconds': 120,
                  'cpu': 0.125,
                  'cpu_limit': 0.25,
                  'memory_mib': 256,
                  'memory_limit_mib': 512,
              })
              sandbox_id = created['sandbox_id']
              print('Realtime E2E sandbox:', sandbox_id)

              started = call(
                  'POST',
                  f'/api/sandboxes/{sandbox_id}/realtime-execs',
                  {
                      'command': "printf 'realtime-first\\n'; read line; printf 'realtime-got:%s\\n' \"$line\"",
                      'pty': False,
                  },
              )
              exec_id = started['exec_id']

              first = call(
                  'GET',
                  f'/api/sandboxes/{sandbox_id}/realtime-execs/{exec_id}/events?cursor=0&wait_seconds=10&max_events=100',
                  timeout=30,
              )
              first_text = ''.join(
                  event.get('data', '')
                  for event in first['events']
                  if event.get('type') == 'stdout'
              )
              if 'realtime-first' not in first_text:
                  raise RuntimeError(f'first realtime stdout was not observed: {first!r}')
              if first['state'] in {'finished', 'failed', 'cancelled'}:
                  raise RuntimeError(f'process finished before stdin roundtrip: {first!r}')
              cursor = first['next_cursor']
              print('Incremental stdout observed before process completion.')

              call(
                  'POST',
                  f'/api/sandboxes/{sandbox_id}/realtime-execs/{exec_id}/input',
                  {'data': 'hello-live\\n'},
              )

              output = ''
              final_state = None
              deadline = time.monotonic() + 20
              while time.monotonic() < deadline:
                  batch = call(
                      'GET',
                      f'/api/sandboxes/{sandbox_id}/realtime-execs/{exec_id}/events'
                      f'?cursor={cursor}&wait_seconds=3&max_events=100',
                      timeout=15,
                  )
                  cursor = batch['next_cursor']
                  output += ''.join(
                      event.get('data', '')
                      for event in batch['events']
                      if event.get('type') == 'stdout'
                  )
                  final_state = batch['state']
                  if final_state in {'finished', 'failed', 'cancelled'}:
                      break

              if 'realtime-got:hello-live' not in output:
                  raise RuntimeError(f'stdin roundtrip output missing: state={final_state!r}, output={output!r}')
              if final_state != 'finished':
                  raise RuntimeError(f'realtime process did not finish cleanly: {final_state!r}')
              print('Realtime stdin + cursor event stream passed.')
          finally:
              if sandbox_id:
                  try:
                      call('DELETE', f'/api/sandboxes/{sandbox_id}', timeout=60)
                      print('Realtime E2E sandbox terminated.')
                  except Exception as cleanup_error:
                      print('WARNING: sandbox cleanup failed:', cleanup_error)
          PY
