name: Deploy Modal Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "modal_app.py"
      - "modal_workspace_mcp/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-modal.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required GitHub Actions secrets
        env:
          GATEWAY_TOKEN: ${{ secrets.MODAL_WORKSPACE_MCP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MODAL_TOKEN_ID" || (echo "Missing MODAL_TOKEN_ID" >&2; exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo "Missing MODAL_TOKEN_SECRET" >&2; exit 1)
          test -n "$GATEWAY_TOKEN" || (echo "Missing MODAL_WORKSPACE_MCP_TOKEN" >&2; exit 1)

      - name: Install project
        run: python -m pip install .

      - name: Verify Modal authentication
        run: modal token info

      - name: Create or update gateway secret
        env:
          GATEWAY_TOKEN: ${{ secrets.MODAL_WORKSPACE_MCP_TOKEN }}
          ALLOWED_SECRETS: ${{ vars.MODAL_WORKSPACE_ALLOWED_SECRETS }}
          ALLOWED_VOLUMES: ${{ vars.MODAL_WORKSPACE_ALLOWED_VOLUMES }}
          DEFAULT_IMAGE_NAME: ${{ vars.MODAL_WORKSPACE_DEFAULT_IMAGE_NAME }}
        run: |
          set -euo pipefail
          args=("MODAL_WORKSPACE_MCP_TOKEN=$GATEWAY_TOKEN")
          if [ -n "${ALLOWED_SECRETS:-}" ]; then
            args+=("MODAL_WORKSPACE_ALLOWED_SECRETS=$ALLOWED_SECRETS")
          fi
          if [ -n "${ALLOWED_VOLUMES:-}" ]; then
            args+=("MODAL_WORKSPACE_ALLOWED_VOLUMES=$ALLOWED_VOLUMES")
          fi
          if [ -n "${DEFAULT_IMAGE_NAME:-}" ]; then
            args+=("MODAL_WORKSPACE_DEFAULT_IMAGE_NAME=$DEFAULT_IMAGE_NAME")
          fi
          modal secret create modal-workspace-mcp-auth --force "${args[@]}"

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          modal deploy modal_app.py 2>&1 | tee /tmp/modal-deploy.log
          endpoint="$(grep -Eo 'https://[A-Za-z0-9.-]+\.modal\.run' /tmp/modal-deploy.log | head -n1)"
          test -n "$endpoint" || (echo "Could not discover deployed Modal endpoint" >&2; exit 1)
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed gateway
        env:
          ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
          GATEWAY_TOKEN: ${{ secrets.MODAL_WORKSPACE_MCP_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$ENDPOINT/healthz" -o /tmp/health.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GATEWAY_TOKEN" \
            "$ENDPOINT/api/apps" -o /tmp/apps.json
          python - <<'PY'
          import json

          with open('/tmp/health.json', encoding='utf-8') as f:
              health = json.load(f)
          if health.get('ok') is not True:
              raise SystemExit(f"healthz failed: {health!r}")
          if health.get('version') != '0.5.0':
              raise SystemExit(f"unexpected deployed version: {health!r}")
          if health.get('realtime_exec') is not True:
              raise SystemExit(f"realtime exec not advertised: {health!r}")
          if health.get('workspace') is not True or health.get('github_repo') is not True:
              raise SystemExit(f"Workspace/Repo mode not advertised: {health!r}")

          with open('/tmp/apps.json', encoding='utf-8') as f:
              apps = json.load(f)
          if not isinstance(apps, list):
              raise SystemExit(f"/api/apps did not return a list: {type(apps).__name__}")
          print(f"Gateway smoke test passed; /api/apps returned {len(apps)} apps", flush=True)
          PY

      - name: Workspace + realtime GitHub E2E
        env:
          ENDPOINT: ${{ steps.deploy.outputs.endpoint }}
          GATEWAY_TOKEN: ${{ secrets.MODAL_WORKSPACE_MCP_TOKEN }}
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          endpoint = os.environ['ENDPOINT'].rstrip('/')
          token = os.environ['GATEWAY_TOKEN']
          workspace_id = None

          def call(method, path, body=None, timeout=180):
              data = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(
                  endpoint + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                  },
              )
              started_at = time.monotonic()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      result = json.loads(response.read().decode('utf-8'))
                  elapsed = time.monotonic() - started_at
                  clean_path = path.split('?', 1)[0]
                  print(f'{method} {clean_path}: {elapsed:.3f}s', flush=True)
                  return result
              except urllib.error.HTTPError as exc:
                  payload = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f'{method} {path} -> HTTP {exc.code}: {payload}') from exc

          def drain_exec(exec_id, cursor=0, deadline_seconds=60):
              stdout = ''
              stderr = ''
              final = None
              deadline = time.monotonic() + deadline_seconds
              while time.monotonic() < deadline:
                  batch = call(
                      'GET',
                      f'/api/workspaces/{workspace_id}/realtime-execs/{exec_id}/events'
                      f'?cursor={cursor}&wait_seconds=3&max_events=200',
                      timeout=45,
                  )
                  cursor = batch['next_cursor']
                  stdout += ''.join(
                      e.get('data', '') for e in batch['events'] if e.get('type') == 'stdout'
                  )
                  stderr += ''.join(
                      e.get('data', '') for e in batch['events'] if e.get('type') == 'stderr'
                  )
                  final = batch
                  if batch['state'] in {'finished', 'failed', 'cancelled'}:
                      return batch, cursor, stdout, stderr
              raise RuntimeError(
                  f'realtime exec deadline exceeded: final={final!r}, stdout={stdout[-1000:]!r}, stderr={stderr[-1000:]!r}'
              )

          try:
              created = call('POST', '/api/workspaces', {
                  'timeout_seconds': 420,
                  'idle_timeout_seconds': 180,
                  'cpu': 0.125,
                  'cpu_limit': 0.25,
                  'memory_mib': 256,
                  'memory_limit_mib': 512,
              })
              workspace_id = created['workspace_id']
              if not re.fullmatch(r'ws-[0-9a-f]{32}', workspace_id):
                  raise RuntimeError(f'invalid workspace id: {workspace_id!r}')
              print('Workspace:', workspace_id, 'Sandbox:', created['sandbox_id'], flush=True)

              resolved = call('GET', f'/api/workspaces/{workspace_id}')
              if resolved['workspace_id'] != workspace_id or not resolved['running']:
                  raise RuntimeError(f'workspace resolution failed: {resolved!r}')
              if resolved.get('root') != '/workspace':
                  raise RuntimeError(f'unexpected workspace root: {resolved!r}')
              print('ws-* tag resolution passed.', flush=True)

              # P0 regression through Workspace abstraction: stdout before finish + stdin roundtrip.
              started = call(
                  'POST',
                  f'/api/workspaces/{workspace_id}/realtime-execs',
                  {
                      'command': "printf 'workspace-first\\n'; read line; printf 'workspace-got:%s\\n' \"$line\"",
                      'pty': False,
                  },
              )
              exec_id = started['exec_id']
              cursor = 0
              first_observed = False
              deadline = time.monotonic() + 30
              while time.monotonic() < deadline:
                  batch = call(
                      'GET',
                      f'/api/workspaces/{workspace_id}/realtime-execs/{exec_id}/events'
                      f'?cursor={cursor}&wait_seconds=3&max_events=100',
                      timeout=45,
                  )
                  cursor = batch['next_cursor']
                  text = ''.join(
                      e.get('data', '') for e in batch['events'] if e.get('type') == 'stdout'
                  )
                  if 'workspace-first' in text:
                      if batch['state'] in {'finished', 'failed', 'cancelled'}:
                          raise RuntimeError(f'Workspace realtime output arrived too late: {batch!r}')
                      first_observed = True
                      break
              if not first_observed:
                  raise RuntimeError('Workspace realtime stdout not observed before process finish')

              call(
                  'POST',
                  f'/api/workspaces/{workspace_id}/realtime-execs/{exec_id}/input',
                  {'data': 'hello-workspace\n'},
                  timeout=45,
              )
              final, cursor, output, err = drain_exec(exec_id, cursor=cursor, deadline_seconds=30)
              if final.get('returncode') != 0 or final.get('state') != 'finished':
                  raise RuntimeError(f'Workspace stdin exec failed: {final!r} {err!r}')
              if 'workspace-got:hello-workspace' not in output:
                  raise RuntimeError(f'Workspace stdin output missing: {output!r}')
              print('Workspace realtime stdout/stdin passed.', flush=True)

              # P2: the actual GitHub relay use-case.
              cloned = call(
                  'POST',
                  f'/api/workspaces/{workspace_id}/repo/clone',
                  {
                      'repository': 'xiaoqianran/modal-workspace-mcp',
                      'depth': 1,
                  },
                  timeout=45,
              )
              clone_exec = cloned['exec_id']
              final, _, clone_out, clone_err = drain_exec(clone_exec, deadline_seconds=90)
              if final.get('returncode') != 0 or final.get('state') != 'finished':
                  raise RuntimeError(
                      f'GitHub clone failed: final={final!r}, stdout={clone_out[-2000:]!r}, stderr={clone_err[-2000:]!r}'
                  )
              print('Realtime GitHub clone completed.', flush=True)

              status = call('GET', f'/api/workspaces/{workspace_id}/repo/status')
              if not re.fullmatch(r'[0-9a-f]{40}', status.get('head') or ''):
                  raise RuntimeError(f'invalid cloned HEAD: {status!r}')
              if status.get('remote') != 'https://github.com/xiaoqianran/modal-workspace-mcp.git':
                  raise RuntimeError(f'unexpected remote: {status!r}')
              if status.get('repo_path') != '/workspace/repo':
                  raise RuntimeError(f'unexpected repo path: {status!r}')
              print(
                  f"Repo status passed: HEAD={status['head'][:12]} branch={status.get('branch')!r} clean={status.get('clean')}",
                  flush=True,
              )

              resolved = call('GET', f'/api/workspaces/{workspace_id}')
              if resolved.get('repo_slug') != 'xiaoqianran/modal-workspace-mcp':
                  raise RuntimeError(f'repo metadata missing from Workspace tags: {resolved!r}')
              print('Workspace Repo metadata persisted in Sandbox tags.', flush=True)
          finally:
              if workspace_id:
                  try:
                      call('DELETE', f'/api/workspaces/{workspace_id}', timeout=60)
                      print('Workspace E2E cleanup passed.', flush=True)
                  except Exception as cleanup_error:
                      print('WARNING: Workspace cleanup failed:', cleanup_error, flush=True)
          PY
